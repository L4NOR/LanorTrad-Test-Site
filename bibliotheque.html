<head>

  <meta name="description" content="Ta bibliothèque LanorTrad : reprends ta lecture là où tu t'étais arrêté.">

  <meta property="og:site_name" content="LanorTrad">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ma bibliothèque — LanorTrad">
  <meta property="og:description" content="Tes séries suivies et tes lectures en cours, réunies au même endroit.">
  <meta property="og:url" content="https://lanortradtest.netlify.app/bibliotheque.html">
  <meta property="og:image" content="https://lanortradtest.netlify.app/images/og/pages/bibliotheque.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ma bibliothèque — LanorTrad">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ma bibliothèque — LanorTrad">
  <meta name="twitter:description" content="Tes séries suivies et tes lectures en cours, réunies au même endroit.">
  <meta name="twitter:image" content="https://lanortradtest.netlify.app/images/og/pages/bibliotheque.jpg">
  <!-- Polices auto-hebergees (voir css/fonts.css) : plus aucune connexion
       tierce avant le premier affichage. Les deux polices reellement
       visibles au chargement sont prechargees. -->
  <link rel="preload" href="fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/sora-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <script src="js/perf.js"></script><link rel="stylesheet" href="css/perf.css"><link rel="stylesheet" href="css/offline.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/extras.css">
  <link rel="stylesheet" href="css/catalogue.css"><link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/reader-card.css">
</head>
<body>
  <div class="loader"><div style="text-align:center"><div class="l-mark">Lanor<span class="grad-text">Trad</span></div><div class="l-bar"><i></i></div></div></div>
  <main>
    <section class="wrap page-head" data-reveal>
      <span class="eyebrow">Ton espace</span>
      <h1>Ma bibliothèque</h1>
      <p>Tes séries suivies et tes lectures en cours, réunies au même endroit.</p>
    </section>

    <section class="wrap" style="padding-top:6px">
      <div id="reader-card-mount"></div>
    </section>

    <section class="section" id="follow-section" style="padding-top:30px">
      <div class="wrap">
        <div class="section-head" data-reveal>
          <div><span class="eyebrow">Tes séries suivies</span><h2>Mes suivis</h2></div>
          <button class="link" id="mark-seen-btn" hidden>Tout marquer comme vu</button>
        </div>
        <div class="card-grid cards-row" id="follow-grid"></div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="wrap">
        <div class="section-head" data-reveal><div><span class="eyebrow">À reprendre</span><h2>Lectures en cours</h2></div></div>
        <div class="card-grid resume-grid" id="resume-grid"></div>
      </div>
    </section>

  </main>

  <script defer src="js/data/series.js"></script><script defer src="js/data/covers.js"></script>
  <script defer src="js/data/chapters.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/palette.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/cards.js"></script>
  <script defer src="js/tilt.js"></script>
  <script defer src="js/supabase-config.js"></script>
  <script defer src="js/sync.js"></script>
  <script defer src="js/views.js"></script>
  <script defer src="js/reader-card.js"></script>
  <script>
    function renderReaderCard() {
      const m = document.getElementById("reader-card-mount");
      window.LTreaderCard && m && window.LTreaderCard.render(m, { identity: window.__ltCardIdentity || null });
    }

    // Identité Supabase (si connecté au forum, même compte) → enrichit la carte
    async function loadCardIdentity() {
      try {
        const C = window.LT_SUPABASE;
        if (!window.supabase || !C || !C.url || !C.anonKey) return;
        const sb = window.supabase.createClient(C.url, C.anonKey);
        const { data: { session } } = await sb.auth.getSession();
        if (!session) return;
        const { data } = await sb.from("profiles").select("username,avatar_url").eq("id", session.user.id).maybeSingle();
        if (data && data.username) {
          window.__ltCardIdentity = { username: data.username, avatarUrl: data.avatar_url };
          renderReaderCard();
        }
      } catch (e) {}
    }

    function renderLibrary() {
      const C = window.CHAPTERS || {};
      const store = window.LTstore;

      // Carte de lecteur (héros de la page) — données locales + identité Supabase
      renderReaderCard();

      // Mes suivis : séries suivies, nouveautés en tête
      const fGrid = document.getElementById("follow-grid");
      const followed = store.follows().map(id => window.LT.seriesById(id)).filter(Boolean)
        .sort((a, b) => (store.isNew(b) - store.isNew(a)) || String(b.lastUpdate || "").localeCompare(String(a.lastUpdate || "")));
      if (followed.length) {
        fGrid.innerHTML = followed.map(LTcard).join("");
      } else {
        fGrid.innerHTML = `<div class="lib-empty" style="grid-column:1/-1"><div class="big">🔔</div><p>Tu ne suis encore aucune série.<br>Un clic sur « Suivre » depuis une fiche, et les nouveaux chapitres t'attendront ici.</p><a class="btn btn-primary" href="catalogue.html" style="margin-top:16px">Parcourir le catalogue</a></div>`;
      }
      const nNew = followed.filter(store.isNew).length;
      const markBtn = document.getElementById("mark-seen-btn");
      markBtn.hidden = nNew === 0;
      markBtn.onclick = () => { store.markAllSeen(); window.LT.toast("Tout est marqué comme vu"); };

      // Reprise
      const grid = document.getElementById("resume-grid");
      const rows = window.LTstore.history().map(({ s, p }) => {
        const ch = (C[s.id] || []).find(c => c.num === p.chapter);
        const pct = ch && ch.pages ? Math.min(100, Math.round(((p.page || 0) / ch.pages) * 100)) : 0;
        return { s, p, pct };
      });
      if (!rows.length) {
        grid.innerHTML = `<div class="lib-empty" style="grid-column:1/-1"><div class="big">📚</div><p>Aucune lecture en cours. Ouvre un premier chapitre, on garde ta page.</p><a class="btn btn-primary" href="catalogue.html" style="margin-top:16px">Découvrir une série</a></div>`;
      } else {
        grid.innerHTML = rows.map(r => `
          <a class="resume" href="${window.LT.urlChapter(r.s, r.p.chapter)}">
            <img src="${r.s.cover}" alt="${r.s.title}" data-fade>
            <div class="info">
              <h4>${r.s.title}</h4>
              <span class="ch">Chapitre ${r.p.chapter}</span>
              <div class="pbar"><i style="width:${r.pct}%"></i></div>
              <span class="when" style="color:var(--txt-mut);font-size:.78rem;margin-top:6px">${r.pct}% lu</span>
            </div>
          </a>`).join("");
      }
      document.dispatchEvent(new Event("lt:cards"));
      window.LT._scanReveals && window.LT._scanReveals();
    }
    document.addEventListener("lt:ready", () => { renderLibrary(); loadCardIdentity(); });
    document.addEventListener("lt:store", renderLibrary);
  </script>
  <script defer src="js/offline.js"></script>
</body>
</html>
