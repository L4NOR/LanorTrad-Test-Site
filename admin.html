<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Notifications — LanorTrad</title>
  <meta name="theme-color" content="#0b0b16">
  <link rel="icon" href="images/icons/icon-192x192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css">
  <style>
    .adm { max-width: 560px; margin: 60px auto; padding: 0 20px; }
    .adm-card { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 26px 24px; }
    .adm h1 { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 4px; }
    .adm .sub { color: var(--txt-mut); font-size: .88rem; margin-bottom: 22px; }
    .adm label { display: block; font-size: .82rem; color: var(--txt-soft); margin: 14px 0 6px; }
    .adm input, .adm select, .adm textarea {
      width: 100%; padding: 11px 13px; border-radius: 12px; background: var(--bg-2);
      border: 1px solid var(--line); color: var(--txt); font-size: .95rem; font-family: inherit;
    }
    .adm textarea { resize: vertical; min-height: 66px; }
    .adm .btn { width: 100%; justify-content: center; margin-top: 20px; }
    .adm-msg { margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: .9rem; display: none; }
    .adm-msg.ok  { display: block; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.4); color: #4ade80; }
    .adm-msg.err { display: block; background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4); color: #f87171; }
    .adm .remember { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--txt-mut); margin-top: 10px; }
    .adm .remember input { width: auto; }
  </style>
</head>
<body>
  <div class="adm">
    <div class="adm-card">
      <h1>🔔 Envoyer une notification</h1>
      <p class="sub">Prévient les abonnés qui suivent la série choisie. Page privée — protégée par le secret admin.</p>
      <form id="adm-form">
        <label for="a-manga">Série</label>
        <select id="a-manga" required></select>

        <label for="a-chap">Numéro de chapitre <span style="color:var(--txt-mut)">(facultatif)</span></label>
        <input id="a-chap" type="text" inputmode="decimal" placeholder="ex : 167">

        <label for="a-msg">Message personnalisé <span style="color:var(--txt-mut)">(facultatif)</span></label>
        <textarea id="a-msg" maxlength="180" placeholder="Laisser vide pour un message automatique."></textarea>

        <label for="a-secret">Secret admin</label>
        <input id="a-secret" type="password" autocomplete="off" required placeholder="ADMIN_SECRET">
        <label class="remember"><input type="checkbox" id="a-remember"> Retenir le secret sur cet appareil</label>

        <button class="btn btn-primary" type="submit" id="a-send">Envoyer la notification</button>
      </form>
      <div class="adm-msg" id="a-result"></div>
    </div>
  </div>

  <script src="js/data/series.js"></script>
  <script>
    (function () {
      const sel = document.getElementById("a-manga");
      const S = (window.SERIES || []).slice().sort((a, b) => a.title.localeCompare(b.title, "fr"));
      sel.innerHTML = S.map(s => `<option value="${s.id.replace(/"/g, "&quot;")}">${s.title}</option>`).join("");

      const secret = document.getElementById("a-secret");
      const remember = document.getElementById("a-remember");
      try { const saved = localStorage.getItem("lt-admin-secret"); if (saved) { secret.value = saved; remember.checked = true; } } catch {}

      const result = document.getElementById("a-result");
      const show = (ok, txt) => { result.className = "adm-msg " + (ok ? "ok" : "err"); result.textContent = txt; };

      document.getElementById("adm-form").addEventListener("submit", async e => {
        e.preventDefault();
        const btn = document.getElementById("a-send");
        btn.disabled = true; btn.textContent = "Envoi…";
        try {
          if (remember.checked) { try { localStorage.setItem("lt-admin-secret", secret.value); } catch {} }
          else { try { localStorage.removeItem("lt-admin-secret"); } catch {} }

          const res = await fetch("/.netlify/functions/notify", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              admin_secret: secret.value,
              manga_id: sel.value,
              chapter: document.getElementById("a-chap").value.trim(),
              message: document.getElementById("a-msg").value.trim() || null
            })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ok) show(true, `✅ Envoyé à ${data.sent} abonné(s) sur ${data.targeted} ciblé(s).${data.cleaned ? " (" + data.cleaned + " expiré(s) nettoyé(s))" : ""}`);
          else if (res.status === 401) show(false, "❌ Secret admin incorrect.");
          else show(false, "❌ Erreur : " + (data.error || res.status));
        } catch (err) {
          show(false, "❌ La fonction d'envoi est-elle déployée ? (" + (err.message || err) + ")");
        } finally { btn.disabled = false; btn.textContent = "Envoyer la notification"; }
      });
    })();
  </script>
</body>
</html>
