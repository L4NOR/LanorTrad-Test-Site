# LanorTrad — configuration Netlify
[build]
  publish = "."
  # Régénère feed.xml + sitemap.xml + og-meta.json à partir des données du site
  command = "node scripts/build-seo.js"

# Scan de secrets : SUPABASE_URL et la clé "publishable" sont PUBLIQUES par
# conception (utilisées dans le navigateur, protégées par les règles RLS), donc
# présentes volontairement dans js/supabase-config.js. On les exclut du scan
# pour éviter un faux positif, sans désactiver la détection des vrais secrets
# (service_role, VAPID privé, etc.).
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VAPID_PUBLIC,VAPID_SUBJECT"

# Fonctions serverless (envoi des notifications push — netlify/functions/notify.js)
[functions]
  directory = "netlify/functions"

# Edge function : injecte les balises OpenGraph par série sur la fiche manga
[[edge_functions]]
  path = "/manga.html"
  function = "og"

# Sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # Force HTTPS pendant 1 an (Netlify sert déjà tout en HTTPS).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Coupe les API navigateur non utilisées par le site.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), payment=(), midi=()"
    # CSP calibrée pour le site + Google Fonts, Supabase, CDN, Google Analytics et
    # AdSense. 'unsafe-inline'/'unsafe-eval' sont requis par les scripts inline
    # (404/bibliothèque) et par AdSense/GA. La protection forte reste sur
    # connect-src (anti-exfiltration), object-src, base-uri et frame-ancestors.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.googleadservices.com https://*.google.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://*.googlesyndication.com https://*.doubleclick.net https://pagead2.googlesyndication.com; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com"

# Images de chapitres : cache long (immuables)
[[headers]]
  for = "/Manga/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Le service worker doit pouvoir se mettre à jour
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Flux RSS : cache court pour refléter vite les nouvelles sorties.
# Servi en text/xml (et non application/rss+xml) pour que les navigateurs
# appliquent la feuille de style feed.xsl (sinon Chrome affiche le XML brut).
# Les agrégateurs (Feedly, Inoreader…) acceptent text/xml sans problème.
[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "text/xml; charset=utf-8"
    Cache-Control = "public, max-age=600"

# Feuille de style du flux (affichage lisible du RSS dans un navigateur)
[[headers]]
  for = "/feed.xsl"
  [headers.values]
    Content-Type = "text/xsl; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Sitemap : cache court
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
