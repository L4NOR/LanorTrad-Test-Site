# LanorTrad — configuration Netlify
[build]
  publish = "."
  # 1. Régénère feed.xml + sitemap.xml + og-meta.json à partir des données du site.
  # 2. Vérifie que le site est cohérent : chapitres declarés dont les pages
  #    existent, couvertures présentes, fichiers de données lisibles, sitemap
  #    d'accord avec les données, precache du service worker valide.
  # 3. Rejoue les tests du pré-rendu servi aux robots.
  #
  # Les deux dernières étapes FONT ÉCHOUER LE DÉPLOIEMENT si elles trouvent
  # une incohérence. C'est délibéré : jusqu'ici ces problèmes-là passaient en
  # une ligne de log et se découvraient en production, souvent des jours plus
  # tard (un fichier de données invalide, un chapitre sans ses images).
  # Un déploiement refusé se répare en poussant ce qui manque.
  command = "node scripts/build-seo.js && node scripts/check.js && node scripts/test-og.mjs"

# Scan de secrets : deux variables ne sont PAS des secrets, malgré leur nom.
#
# SUPABASE_URL (et la clé "publishable") sont publiques par conception :
# utilisées dans le navigateur, protégées par les règles RLS, donc présentes
# volontairement dans js/supabase-config.js.
#
# VAPID_SUBJECT est l'adresse de contact du push web (« mailto:… »). Elle est
# envoyée en clair dans l'en-tête JWT de chaque notification, précisément pour
# que le service de push puisse nous joindre. C'est la MÊME adresse que celle
# publiée dans les mentions légales et la politique de confidentialité, d'où
# la détection. Le vrai secret du push, c'est VAPID_PRIVATE, qui reste scanné.
#
# On exclut ces deux clés uniquement, sans désactiver la détection des vrais
# secrets (SUPABASE_SERVICE_ROLE, VAPID_PRIVATE, PUSH_SECRET…).
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VAPID_SUBJECT"

# =========================================================================
# Adresses lisibles (reecritures, statut 200 : l'URL affichee ne change pas)
#
#   /manga/tougen-anki/                -> manga.html?id=tougen-anki
#   /manga/tougen-anki/lecture/        -> reader.html?manga=tougen-anki
#   /manga/tougen-anki/chapitre-240/   -> reader.html?manga=…&chapter=chapitre-240
#   /genre/horreur/                    -> catalogue.html?genre=horreur
#
# Le site reste un fichier manga.html unique pour toutes les series : ce sont
# ces regles, et elles seules, qui donnent a chaque serie sa propre adresse.
# Ce que recoit la page, c'est le SLUG (« tougen-anki »), pas l'identifiant
# reel (« Tougen Anki ») : c'est js/core.js (route + seriesById) qui fait le
# rapprochement, cote navigateur comme cote edge function.
#
# Les anciennes adresses en ?id= continuent de fonctionner telles quelles —
# rien n'est supprime, un vieux lien ou un vieux partage reste valable. Elles
# declarent simplement un canonical vers la nouvelle forme.
#
# Un fichier reel l'emporte toujours sur ces regles (force = false par defaut),
# donc /Manga/<serie>/… (les images) n'est jamais capte.
# =========================================================================
[[redirects]]
  from = "/manga/:slug"
  to = "/manga.html?id=:slug"
  status = 200

[[redirects]]
  from = "/manga/:slug/"
  to = "/manga.html?id=:slug"
  status = 200

[[redirects]]
  from = "/manga/:slug/:chapitre"
  to = "/reader.html?manga=:slug&chapter=:chapitre"
  status = 200

[[redirects]]
  from = "/manga/:slug/:chapitre/"
  to = "/reader.html?manga=:slug&chapter=:chapitre"
  status = 200

[[redirects]]
  from = "/genre/:genre"
  to = "/catalogue.html?genre=:genre"
  status = 200

[[redirects]]
  from = "/genre/:genre/"
  to = "/catalogue.html?genre=:genre"
  status = 200

# Edge function : pour les robots seulement, injecte les vraies balises
# (titre, description, canonical, OpenGraph, JSON-LD) et un pré-rendu du
# contenu sur la fiche série ET sur chaque page de chapitre.
[[edge_functions]]
  path = "/manga.html"
  function = "og"

[[edge_functions]]
  path = "/reader.html"
  function = "og"

# Vues par genre (catalogue.html?genre=Horreur) : la grille est remplie par JS,
# un robot n'y verrait qu'un formulaire de filtres. Sans genre, la page passe
# inchangée.
[[edge_functions]]
  path = "/catalogue.html"
  function = "og"

# Memes pages, sous leur adresse lisible. Declarer les deux formes est
# volontaire : selon que la reecriture s'applique avant ou apres l'edge
# function, la requete se presente sous l'une ou sous l'autre.
[[edge_functions]]
  path = "/manga/*"
  function = "og"

[[edge_functions]]
  path = "/genre/*"
  function = "og"

# Sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # Force HTTPS pendant 1 an (Netlify sert déjà tout en HTTPS).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Coupe les API navigateur non utilisées par le site.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), payment=(), midi=()"
    # CSP calibrée pour le site + Supabase et Google Analytics.
    # Les domaines publicitaires (AdSense, DoubleClick) ont été retirés en même
    # temps que le script AdSense : plus aucune régie n'est autorisée, et
    # frame-src est désormais vide (aucune iframe tierce possible).
    # Les polices étant auto-hébergées, style-src et font-src n'autorisent plus
    # que 'self' : aucune feuille de style ni police tierce n'est chargeable.
    # jsDelivr et cdnjs ont disparu de script-src : supabase-js et JSZip sont
    # désormais servis depuis js/vendor/. Plus AUCUN script tiers n'est
    # chargeable en dehors de gtag.js, qui n'arrive qu'après consentement.
    # 'unsafe-inline'/'unsafe-eval' restent requis par les scripts inline
    # (404/bibliothèque) et par gtag.js. La protection forte est sur connect-src
    # (anti-exfiltration), object-src, base-uri et frame-ancestors.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com"

# Images de chapitres : cache long (immuables)
[[headers]]
  for = "/Manga/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Feuilles de style et scripts. Par défaut Netlify sert tout en max-age=0,
# must-revalidate : chaque visite refaisait un aller-retour par fichier (10 CSS
# + 17 JS) juste pour s'entendre dire « rien n'a changé ».
# stale-while-revalidate : le navigateur affiche immédiatement la version en
# cache et va chercher la nouvelle en arrière-plan. Une mise à jour du site est
# donc visible à la navigation suivante, sans jamais faire attendre personne.
# Polices : contenu figé, nom de fichier figé -> cache d'un an.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=604800"

# Bibliothèques tierces auto-hébergées. Le numéro de version est dans le nom du
# fichier : un contenu donné ne change jamais d'URL, donc cache d'un an.
# Mettre à jour = déposer un nouveau fichier et changer la référence.
[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Données (chapitres, couvertures, listes de pages) : cache court, pour qu'un
# nouveau chapitre apparaisse sans attendre.
[[headers]]
  for = "/js/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

# Le service worker doit pouvoir se mettre à jour
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Flux RSS : cache court pour refléter vite les nouvelles sorties.
# Servi en text/xml (et non application/rss+xml) pour que les navigateurs
# appliquent la feuille de style feed.xsl (sinon Chrome affiche le XML brut).
# Les agrégateurs (Feedly, Inoreader…) acceptent text/xml sans problème.
[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "text/xml; charset=utf-8"
    Cache-Control = "public, max-age=600"

# Feuille de style du flux (affichage lisible du RSS dans un navigateur)
[[headers]]
  for = "/feed.xsl"
  [headers.values]
    Content-Type = "text/xsl; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Sitemaps : l'index + un fichier par série (voir scripts/build-seo.js). Cache court.
[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
